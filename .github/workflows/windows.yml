name: Windows build and verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/cache@v4
        with:
          path: downloads
          key: windows-dependencies-${{ hashFiles('dependencies.lock.json') }}
      - name: Clean setup and synthetic demo
        shell: powershell
        run: .\setup.ps1 -Demo
      - name: Verify without football API access
        shell: powershell
        run: .\verify.ps1 -Integration -Graphics
      - name: Package source
        run: python scripts/package_source.py
      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: poisson-studio-source
          path: dist/*
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-evidence
          path: |
            test-output/*.log
            exports/smoke_*.png
          if-no-files-found: ignore
